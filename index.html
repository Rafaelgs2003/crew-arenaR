<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscaminas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header class="game__header">
      <h1>Buscaminas</h1>
      <div class="tabs" role="tablist" aria-label="Modo de juego">
        <button type="button" class="tab" role="tab" data-mode="niveles" aria-selected="true">Niveles</button>
        <button type="button" class="tab" role="tab" data-mode="libre" aria-selected="false">Libre</button>
      </div>
    </header>

    <section id="level-panel" class="panel">
      <div id="level-list" class="levels"></div>
      <button id="reset-progress" type="button" class="link-btn">Reiniciar progreso</button>
    </section>

    <section id="free-panel" class="panel" hidden>
      <label for="difficulty">Dificultad</label>
      <select id="difficulty">
        <option value="facil">Fácil (9×9, 10 minas)</option>
        <option value="medio">Medio (16×16, 40 minas)</option>
        <option value="dificil">Difícil (16×30, 99 minas)</option>
      </select>
      <button id="new-free" type="button">Nueva partida</button>
    </section>

    <section class="hud" aria-label="Marcador">
      <div class="hud__box">
        <span>Minas</span>
        <output id="mines-left">000</output>
      </div>
      <button id="face" type="button" aria-label="Nueva partida">🙂</button>
      <div class="hud__box">
        <span>Tiempo</span>
        <output id="timer">000</output>
      </div>
    </section>

    <p id="info" class="info"></p>

    <div class="board-wrap">
      <div id="board" class="board" role="group" aria-label="Tablero de juego"></div>
    </div>

    <p id="message" class="message" aria-live="polite"></p>

    <div class="controls">
      <button id="flag-toggle" type="button" aria-pressed="false">Modo bandera: inactivo</button>
      <button id="restart" type="button">Reiniciar</button>
    </div>
  </main>

  <div id="overlay" class="overlay" hidden>
    <div class="overlay__card" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
      <h2 id="overlay-title"></h2>
      <p id="overlay-text"></p>
      <div class="overlay__actions">
        <button id="overlay-primary" type="button"></button>
        <button id="overlay-close" type="button" class="btn-ghost">Cerrar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
