<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscaminas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app__top">
      <h1 class="app__title">Buscaminas</h1>
      <div class="segmented" role="tablist" aria-label="Modo de juego">
        <button type="button" class="segmented__btn is-active" role="tab" data-mode="niveles" aria-selected="true">Niveles</button>
        <button type="button" class="segmented__btn" role="tab" data-mode="libre" aria-selected="false">Libre</button>
      </div>
    </header>

    <section id="level-panel" class="card">
      <div class="card__head">
        <h2 class="card__title">Campaña</h2>
        <div class="totals">
          <span id="total-stars" class="totals__item">★ 0/30</span>
          <span id="total-score" class="totals__item">0 pts</span>
          <button id="reset-progress" type="button" class="btn btn--ghost btn--sm">Reiniciar progreso</button>
        </div>
      </div>
      <div id="level-list" class="levels"></div>
    </section>

    <section id="free-panel" class="card card--row" hidden>
      <div class="field">
        <label for="difficulty">Dificultad</label>
        <select id="difficulty">
          <option value="facil">Fácil · 12×8 · 12 minas</option>
          <option value="medio">Medio · 20×12 · 45 minas</option>
          <option value="dificil">Difícil · 30×16 · 99 minas</option>
        </select>
      </div>
      <button id="new-free" type="button" class="btn btn--primary">Nueva partida</button>
    </section>

    <section class="scoreboard" aria-label="Marcador">
      <div class="scoreboard__box">
        <span class="scoreboard__label">Minas</span>
        <output id="mines-left" class="scoreboard__value">000</output>
      </div>
      <button id="face" type="button" class="face" aria-label="Nueva partida">·‿·</button>
      <div class="scoreboard__box">
        <span class="scoreboard__label">Tiempo</span>
        <output id="timer" class="scoreboard__value">000</output>
      </div>
    </section>

    <p id="info" class="info"></p>

    <div class="board-wrap">
      <div id="board" class="board" role="group" aria-label="Tablero de juego"></div>
    </div>

    <p id="message" class="message" aria-live="polite"></p>

    <div class="controls">
      <button id="flag-toggle" type="button" class="btn btn--ghost" aria-pressed="false">⚑ Modo bandera: inactivo</button>
      <button id="restart" type="button" class="btn">Reiniciar</button>
    </div>

    <p class="hint">Clic izquierdo para descubrir · Clic derecho o tecla F para bandera · Clic en un número para despejar vecinas</p>
  </main>

  <div id="overlay" class="overlay" hidden>
    <div class="overlay__card" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
      <h2 id="overlay-title" class="overlay__title"></h2>
      <p id="overlay-text" class="overlay__text"></p>
      <div class="overlay__actions">
        <button id="overlay-primary" type="button" class="btn btn--primary"></button>
        <button id="overlay-close" type="button" class="btn btn--ghost">Cerrar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
